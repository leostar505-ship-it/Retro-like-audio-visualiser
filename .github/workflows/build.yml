name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install numpy pytest
      - run: xvfb-run -a python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AudioVisualiser
          --hidden-import pyaudiowpatch
          run.py
      - uses: actions/upload-artifact@v4
        with:
          name: AudioVisualiser-windows
          path: dist/AudioVisualiser.exe
          if-no-files-found: error
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AudioVisualiser.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=v$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' audiovis/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: AudioVisualiser-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: AudioVisualiser.exe
          generate_release_notes: true
